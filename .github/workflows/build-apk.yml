name: Build APK

# Builds an installable debug APK. After the run, open it and download "AKZSA-debug-apk" from Artifacts.
on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AKZSA-Android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew --no-daemon :app:testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: AKZSA-debug-apk
          path: AKZSA-Android/app/build/outputs/apk/**/*.apk
